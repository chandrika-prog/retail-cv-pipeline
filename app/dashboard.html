<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purplle - Store Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #f7f3ff;
    --bg-soft: #efe6ff;
    --panel: #ffffff;
    --panel-strong: #fbf9ff;
    --ink: #1d1630;
    --muted: #756a88;
    --line: #ded4ef;
    --purple: #6f2dbd;
    --purple-2: #8a3ffc;
    --purple-3: #c8a2ff;
    --teal: #0f9f94;
    --amber: #c87900;
    --rose: #d63b63;
    --shadow: 0 16px 40px rgba(65, 36, 105, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      linear-gradient(180deg, #fbf9ff 0%, var(--bg) 42%, #ffffff 100%);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .header {
    background:
      linear-gradient(135deg, rgba(111, 45, 189, 0.96), rgba(138, 63, 252, 0.92)),
      #6f2dbd;
    color: #ffffff;
    padding: 22px 32px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.24);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    box-shadow: 0 12px 30px rgba(111, 45, 189, 0.22);
  }

  .brand-row { display: flex; align-items: center; gap: 14px; }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: #ffffff;
    color: var(--purple);
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 800;
    box-shadow: 0 10px 22px rgba(23, 16, 44, 0.18);
  }

  .brand-title {
    font-size: 23px;
    font-weight: 800;
    line-height: 1.1;
  }

  .brand-meta {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.76);
    margin-top: 5px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .store-select {
    background: rgba(255, 255, 255, 0.96);
    color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: 8px;
    padding: 9px 34px 9px 12px;
    font-size: 13px;
    font-weight: 700;
    outline: none;
    box-shadow: 0 8px 18px rgba(31, 20, 52, 0.12);
  }

  .status-pill,
  .live-badge {
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.26);
    color: #ffffff;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #37e0a1;
    margin-right: 8px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    padding: 24px 32px 0;
  }

  .card,
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .card {
    min-height: 132px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: linear-gradient(90deg, var(--purple), var(--purple-3));
  }

  .card.warn::before { background: linear-gradient(90deg, var(--amber), #ffd166); }
  .card.ok::before { background: linear-gradient(90deg, var(--teal), #7be0d6); }

  .card .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0;
    font-weight: 800;
  }

  .card .value {
    font-size: 36px;
    line-height: 1;
    font-weight: 850;
    margin: 13px 0 7px;
    color: var(--purple);
  }

  .card.warn .value { color: var(--amber); }
  .card.ok .value { color: var(--teal); }
  .card .sub { font-size: 12px; color: var(--muted); }

  .bottom {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px 32px 28px;
  }

  .panel {
    padding: 18px;
    min-width: 0;
  }

  .panel h3 {
    font-size: 13px;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .panel h3::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--purple);
    box-shadow: 0 0 0 4px rgba(111, 45, 189, 0.12);
  }

  .feed { height: 320px; overflow-y: auto; padding-right: 4px; }

  .feed-item {
    display: grid;
    grid-template-columns: 72px 142px minmax(0, 1fr) 72px;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee6f7;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .badge {
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 850;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ENTRY { background: rgba(15, 159, 148, 0.12); color: #087e74; }
  .EXIT { background: rgba(214, 59, 99, 0.12); color: #b6294f; }
  .ZONE_ENTER { background: rgba(111, 45, 189, 0.12); color: var(--purple); }
  .ZONE_EXIT { background: rgba(117, 106, 136, 0.14); color: #584c6c; }
  .ZONE_DWELL { background: rgba(138, 63, 252, 0.13); color: #6b28c6; }
  .REENTRY { background: rgba(200, 121, 0, 0.14); color: var(--amber); }
  .BILLING_QUEUE_JOIN { background: rgba(200, 121, 0, 0.14); color: var(--amber); }
  .BILLING_QUEUE_ABANDON { background: rgba(214, 59, 99, 0.13); color: var(--rose); }
  .POS_TRANSACTION { background: rgba(15, 159, 148, 0.13); color: var(--teal); }

  .feed-time { font-size: 11px; color: var(--muted); }
  .feed-visitor {
    font-size: 12px;
    color: var(--ink);
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .feed-conf { font-size: 11px; color: var(--muted); text-align: right; }
  .empty-state { color: var(--muted); font-size: 13px; padding: 10px 0; }

  .chart-wrap { height: 320px; position: relative; }
  .wide { grid-column: 1 / -1; }
  .heatmap { display: grid; gap: 2px; }

  .heat-row {
    display: grid;
    grid-template-columns: minmax(150px, 1.15fr) 110px minmax(120px, 1fr) 82px 104px;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #eee6f7;
  }

  .zone-name { font-size: 13px; color: var(--ink); font-weight: 750; }
  .zone-type { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .heat-track { height: 10px; background: #eee6f7; border-radius: 999px; overflow: hidden; }
  .heat-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--teal));
    border-radius: 999px;
  }
  .heat-stat { font-size: 12px; color: var(--ink); text-align: right; font-weight: 700; }
  .rev { color: var(--amber); font-size: 11px; text-align: right; }

  @media (max-width: 1050px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bottom { grid-template-columns: 1fr; }
  }

  @media (max-width: 680px) {
    .header { align-items: flex-start; flex-direction: column; padding: 18px; }
    .header-actions { width: 100%; justify-content: flex-start; }
    .grid, .bottom { grid-template-columns: 1fr; padding-left: 18px; padding-right: 18px; }
    .feed-item { grid-template-columns: 1fr; align-items: start; }
    .feed-conf { text-align: left; }
    .heat-row { grid-template-columns: 1fr; align-items: start; }
    .heat-stat, .rev { text-align: left; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand-row">
    <div class="brand-mark">P</div>
    <div>
      <div class="brand-title">PURPLLE STORE INTELLIGENCE</div>
      <div class="brand-meta">
        <span id="store-label">ST1</span> | Live retail analytics | <span id="clock"></span>
      </div>
    </div>
  </div>
  <div class="header-actions">
    <select id="store-select" class="store-select" aria-label="Store filter">
      <option value="ST1">Store 1</option>
      <option value="ST2">Store 2</option>
    </select>
    <div id="conn-status" class="status-pill">Connecting...</div>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>
</div>

<div class="grid">
  <div class="card ok">
    <div class="label">Qualified Visitors</div>
    <div class="value" id="kpi-visitors">-</div>
    <div class="sub">dwell or billing activity</div>
  </div>
  <div class="card">
    <div class="label">Conversion Rate</div>
    <div class="value" id="kpi-conversion">-</div>
    <div class="sub">visitors -> purchase</div>
  </div>
  <div class="card">
    <div class="label">Avg Dwell Time</div>
    <div class="value" id="kpi-dwell">-</div>
    <div class="sub">per zone visit</div>
  </div>
  <div class="card warn">
    <div class="label">Active Anomalies</div>
    <div class="value" id="kpi-anomalies">-</div>
    <div class="sub">alerts</div>
  </div>
</div>

<div class="bottom">
  <div class="panel">
    <h3>Live Event Feed</h3>
    <div class="feed" id="feed"></div>
  </div>
  <div class="panel">
    <h3>Conversion Funnel</h3>
    <div class="chart-wrap">
      <canvas id="funnelChart"></canvas>
    </div>
  </div>
  <div class="panel wide">
    <h3>Zone Heatmap</h3>
    <div class="heatmap" id="heatmap"></div>
  </div>
</div>

<script>
const AVAILABLE_STORES = ['ST1', 'ST2'];
let STORE = new URLSearchParams(window.location.search).get('store') || 'ST1';
if (!AVAILABLE_STORES.includes(STORE)) STORE = 'ST1';
const IS_FILE_MODE = window.location.protocol === 'file:';
const API = IS_FILE_MODE ? 'http://127.0.0.1:8001' : '';
let ws = null;

const palette = {
  purple: '#6f2dbd',
  purpleSoft: 'rgba(111, 45, 189, 0.12)',
  purpleMid: 'rgba(111, 45, 189, 0.45)',
  teal: '#0f9f94',
  amber: '#c87900',
  grid: '#eadff6',
  muted: '#756a88',
};

document.getElementById('store-label').textContent = STORE;
document.getElementById('store-select').value = STORE;
if (IS_FILE_MODE) {
  document.getElementById('conn-status').textContent = 'Local API mode';
  document.getElementById('conn-status').style.color = '#fff';
}

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);

const ctx = document.getElementById('funnelChart').getContext('2d');
const funnelChart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Entry', 'Zone Visit', 'Billing', 'Purchase'],
    datasets: [{
      label: 'Visitors',
      data: [0, 0, 0, 0],
      backgroundColor: [
        'rgba(111, 45, 189, 0.84)',
        'rgba(138, 63, 252, 0.66)',
        'rgba(15, 159, 148, 0.62)',
        'rgba(200, 121, 0, 0.58)'
      ],
      borderColor: [palette.purple, '#8a3ffc', palette.teal, palette.amber],
      borderWidth: 1,
      borderRadius: 8,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display: false }, ticks: { color: palette.muted, font: { weight: 700 } } },
      y: { grid: { color: palette.grid }, ticks: { color: palette.muted } }
    }
  }
});

async function refreshMetrics() {
  try {
    const [m, f, a] = await Promise.all([
      fetch(`${API}/stores/${STORE}/metrics`).then(r=>r.json()),
      fetch(`${API}/stores/${STORE}/funnel`).then(r=>r.json()),
      fetch(`${API}/stores/${STORE}/anomalies`).then(r=>r.json()),
    ]);
    document.getElementById('kpi-visitors').textContent = m.unique_visitors;
    document.getElementById('kpi-conversion').textContent = (m.conversion_rate*100).toFixed(1)+'%';
    document.getElementById('kpi-dwell').textContent = Math.round(m.avg_dwell_ms/1000)+'s';
    document.getElementById('kpi-anomalies').textContent = a.anomalies.length;
    funnelChart.data.datasets[0].data = f.funnel.map(s => s.visitors);
    funnelChart.update();
  } catch(e) { console.error(e); }
}

function addFeedItem(ev) {
  const feed = document.getElementById('feed');
  const time = ev.timestamp ? ev.timestamp.split('T')[1].replace('Z','') : '--:--:--';
  const div = document.createElement('div');
  div.className = 'feed-item';
  div.innerHTML = `
    <span class="feed-time">${time}</span>
    <span class="badge ${ev.event_type}">${ev.event_type}</span>
    <span class="feed-visitor">${ev.visitor_id}</span>
    <span class="feed-conf">conf:${ev.confidence?.toFixed(2) ?? '-'}</span>
  `;
  feed.insertBefore(div, feed.firstChild);
  if (feed.children.length > 50) feed.removeChild(feed.lastChild);
}

async function loadRecentEvents() {
  try {
    const payload = await fetch(`${API}/stores/${STORE}/events/recent?limit=30`).then(r=>r.json());
    const feed = document.getElementById('feed');
    feed.innerHTML = '';
    if (!payload.events.length) {
      feed.innerHTML = '<div class="empty-state">No events for this store</div>';
      return;
    }
    [...payload.events].reverse().forEach(addFeedItem);
  } catch(e) { console.error(e); }
}

async function refreshHeatmap() {
  try {
    const payload = await fetch(`${API}/stores/${STORE}/heatmap`).then(r=>r.json());
    const heatmap = document.getElementById('heatmap');
    if (!payload.zones.length) {
      heatmap.innerHTML = '<div class="empty-state">No zone activity for this store</div>';
      return;
    }
    heatmap.innerHTML = payload.zones.map(zone => {
      const intensity = Math.max(0, Math.min(100, Number(zone.intensity || 0)));
      const dwellSeconds = Math.round((zone.avg_dwell_ms || 0) / 1000);
      return `
        <div class="heat-row">
          <div>
            <div class="zone-name">${zone.zone_name || zone.zone_id}</div>
            <div class="zone-type">${zone.zone_id}</div>
          </div>
          <div class="zone-type">${zone.zone_type || 'UNKNOWN'}</div>
          <div class="heat-track"><div class="heat-fill" style="width:${intensity}%"></div></div>
          <div class="heat-stat">${zone.visits} visits</div>
          <div class="rev">${zone.is_revenue_zone ? 'Revenue' : 'Non-rev'} | ${dwellSeconds}s</div>
        </div>
      `;
    }).join('');
  } catch(e) { console.error(e); }
}

function connectWS() {
  if (ws) {
    ws.onclose = null;
    ws.close();
  }
  const wsUrl = IS_FILE_MODE
    ? `ws://127.0.0.1:8001/ws/live/${STORE}`
    : `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/live/${STORE}`;
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    document.getElementById('conn-status').textContent = 'Connected';
    document.getElementById('conn-status').style.color = '#fff';
  };
  ws.onmessage = (msg) => {
    const payload = JSON.parse(msg.data);
    if (payload.type === 'event' && payload.data.store_id === STORE) {
      addFeedItem(payload.data);
      refreshMetrics();
      refreshHeatmap();
    }
  };
  ws.onclose = () => {
    document.getElementById('conn-status').textContent = 'Reconnecting...';
    document.getElementById('conn-status').style.color = '#fff';
    setTimeout(connectWS, 3000);
  };
}

function setStore(storeId) {
  STORE = storeId;
  document.getElementById('store-label').textContent = STORE;
  document.getElementById('store-select').value = STORE;
  document.getElementById('feed').innerHTML = '';
  history.replaceState(null, '', `${window.location.pathname}?store=${encodeURIComponent(STORE)}`);
  refreshMetrics();
  refreshHeatmap();
  loadRecentEvents();
  connectWS();
}

document.getElementById('store-select').addEventListener('change', (event) => {
  setStore(event.target.value);
});

refreshMetrics();
refreshHeatmap();
loadRecentEvents();
setInterval(refreshMetrics, 1000);
setInterval(refreshHeatmap, 5000);
connectWS();
</script>
</body>
</html>
